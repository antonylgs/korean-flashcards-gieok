cards:
  - id: ko-a-neun-b-eu-ro-bakkwida
    categories:
      - grammar
    front: A changes into B
    back: (A는) B(으)로 바뀌다
    pronunciation: (A-neun) B-(eu)ro bakkwida
    examples:
      - target: 이후에 바이올린 음악으로 바뀌었어요.
        translation: After that, it changed to violin music.
  - id: ko-a-a-eo-jida
    categories:
      - grammar
    front: to become A
    back: A-(아/어)지다
    pronunciation: A-(a-eo)jida
    examples:
      - target: 말도 많아지고 사람들 앞에서도 부끄러워하지 않습니다.
        translation: I became more talkative and am no longer shy in front of people.
  - id: ko-v-eu-ryeogo
    categories:
      - grammar
    front: intending to V1, in order to V2
    back: V-(으)려고
    pronunciation: V-(eu)ryeogo
  - id: ko-v-eu-myeonseo
    categories:
      - grammar
    front: while doing V
    back: V-(으)면서
    pronunciation: V-(eu)myeonseo
    examples:
      - target: 매달 열리는 이 행사는 천천히 걸으면서 공원의 경치를 즐기는 행사입니다.
        translation: This monthly event is an event where people walk slowly while enjoying the park scenery.
  - id: ko-v-gi-wihaeseo
    categories:
      - grammar
    front: in order to do V
    back: V-기 위해서
    pronunciation: V-gi wihaeseo
    examples:
      - target: 그래서 사람들에게 갈아타는 역을 잘 알려 주기 위해서 새소리를 함께 사용하게 되었습니다.
        translation: So bird sounds also came to be used to clearly inform people of the transfer station.
  - id: ko-gage
    categories:
      - shopping
    front: store, shop
    back: 가게
    pronunciation: gage
    examples:
      - target: 이 가게는 옷을 많이 팔아요.
        translation: This store sells a lot of clothes.
  - id: ko-gagyeok
    categories:
      - shopping
    front: price
    back: 가격
    pronunciation: gagyeok
    examples:
      - target: 이 바지의 가격은 얼마인가요?
        translation: What is the price of these pants?
  - id: ko-garodeung
    categories:
      - city
    front: streetlamp, streetlight
    back: 가로등
    pronunciation: garodeung
    examples:
      - target: 밤이 되면 가로등이 환하게 길을 밝혀준다.
        translation: When night falls, the streetlights brightly illuminate the road.
  - id: ko-gaunde
    categories:
      - position
    front: middle, center, among
    back: 가운데
    pronunciation: gaunde
    examples:
      - target: 테이블 가운데에 꽃병이 놓여 있어요.
        translation: There's a vase in the middle of the table.
  - id: ko-ganjireopda
    categories:
      - sensation
    front: to be itchy
    back: 간지럽다
    pronunciation: ganjireopda
    examples:
      - target: 모기에 물려서 다리가 간지러워요.
        translation: My leg is itchy because I was bitten by a mosquito.
  - id: ko-galsaek
    categories:
      - colors
    front: brown
    back: 갈색
    pronunciation: galsaek
  - id: ko-geosil
    categories:
      - home
    front: living room
    back: 거실
    pronunciation: geosil
    examples:
      - target: 우리 집 거실은 아주 넓어요.
        translation: Our living room is very spacious.
  - id: ko-geonneo
    categories:
      - direction
    front: across, over (to the other side)
    back: 건너
    pronunciation: geonneo
    examples:
      - target: 길을 건너세요.
        translation: Cross the road.
  - id: ko-geonjogi
    categories:
      - appliances
    front: clothes dryer; tumble dryer
    back: 건조기
    pronunciation: geonjogi
    examples:
      - target: 세탁기가 고장 나서 빨래를 건조기에 넣었어요.
        translation: The washing machine broke down, so I put the laundry in the dryer.
  - id: ko-geomeunsaek
    categories:
      - colors
    front: black
    back: 검은색
    pronunciation: geomeunsaek
  - id: ko-gedaga
    categories:
      - connectors
    front: moreover, on top of that
    back: 게다가
    pronunciation: gedaga
    examples:
      - target: 비가 옵니다. 게다가 바람도 많이 붑니다.
        translation: It's raining, and on top of that it's very windy.
  - id: ko-gyeolguk
    categories:
      - connectors
    front: eventually, in the end, after all
    back: 결국
    pronunciation: gyeolguk
    examples:
      - target: 우리는 결국 그 문제를 해결했습니다.
        translation: We eventually solved the problem.
  - id: ko-gyeongchi
    categories:
      - nature
    front: scenery
    back: 경치
    pronunciation: gyeongchi
    examples:
      - target: 경치 즐기다
        translation: Enjoy the scenery.
  - id: ko-goso-gongpojeung
    categories:
      - phobia
    front: acrophobia (fear of heights)
    back: 고소공포증
    pronunciation: goso gongpojeung
    examples:
      - target: 저는 고소공포증이 있어서 높은 곳에 못 올라가요.
        translation: I have acrophobia, so I can't go up high places.
  - id: ko-gojangnada
    categories:
      - malfunction
    front: to break down, to malfunction
    back: 고장나다
    pronunciation: gojangnada
    examples:
      - target: 내 차가 고장났어.
        translation: My car broke down.
  - id: ko-golmok
    categories:
      - place
    front: alley, lane
    back: 골목
    pronunciation: golmok
    examples:
      - target: 좁은 골목길을 지나 공원으로 갔다.
        translation: We passed through a narrow alley and went to the park.
  - id: ko-gwanramhada
    categories:
      - culture
    front: to view, to watch, to observe (a performance, exhibition, game, etc.)
    back: 관람하다
    pronunciation: gwanramhada
    examples:
      - target: 우리는 주말에 박물관에서 특별 전시를 관람했습니다.
        translation: We viewed a special exhibition at the museum on the weekend.
  - id: ko-gwaenhi
    categories:
      - emotion
    front: for no reason, unnecessarily, in vain
    back: 괜히
    pronunciation: gwaenhi
    examples:
      - target: 괜히 걱정했네요.
        translation: I worried for no reason.
  - id: ko-gungja
    categories:
      - history
    front: archer, bowman
    back: 궁자
    pronunciation: gungja
    examples:
      - target: 옛날에는 뛰어난 궁자가 나라를 지키는 데 큰 역할을 했다.
        translation: In ancient times, a skilled archer played a significant role in defending the country.
  - id: ko-gwisin
    categories:
      - supernatural
    front: ghost
    back: 귀신
    pronunciation: gwisin
    examples:
      - target: 밤에 혼자 있을 때 귀신이 나타날까 봐 무서웠어요.
        translation: I was scared a ghost might appear when I was alone at night.
  - id: ko-geu-ttaemune
    categories:
      - connectors
    front: because of that
    back: 그 때문에
    pronunciation: geu ttaemune
    examples:
      - target: 길이 막혔습니다. 그 때문에 늦었습니다.
        translation: Traffic was bad. Because of that, I was late.
  - id: ko-geu-hue
    categories:
      - connectors
    front: after that
    back: 그 후에
    pronunciation: geu hue
    examples:
      - target: 학교에 갔습니다. 그 후에 친구를 만났습니다.
        translation: I went to school. After that, I met a friend.
  - id: ko-geudaeume
    categories:
      - connectors
    front: next
    back: 그다음에
    pronunciation: geudaeume
    examples:
      - target: 책을 읽었습니다. 그다음에 잤습니다.
        translation: I read a book. Then I slept.
  - id: ko-geuraedo
    categories:
      - connectors
    front: nevertheless, even so
    back: 그래도
    pronunciation: geuraedo
    examples:
      - target: 비가 옵니다. 그래도 갑니다.
        translation: It's raining. Even so, I'm going.
  - id: ko-geuraeseo
    categories:
      - connectors
    front: so, therefore
    back: 그래서
    pronunciation: geuraeseo
    examples:
      - target: 비가 왔습니다. 그래서 집에 있었습니다.
        translation: It rained, so I stayed home.
  - id: ko-geureona
    categories:
      - connectors
    front: however
    back: 그러나
    pronunciation: geureona
    examples:
      - target: 열심히 공부했습니다. 그러나 시험이 어려웠습니다.
        translation: I studied hard. However, the test was difficult.
  - id: ko-geureomyeon
    categories:
      - connectors
    front: then, in that case
    back: 그러면
    pronunciation: geureomyeon
    examples:
      - target: 시간이 없어요? 그러면 내일 합시다.
        translation: No time? Then let's do it tomorrow.
  - id: ko-geureomeuro
    categories:
      - connectors
    front: therefore
    back: 그러므로
    pronunciation: geureomeuro
    examples:
      - target: 위험합니다. 그러므로 조심해야 합니다.
        translation: It is dangerous. Therefore, you must be careful.
  - id: ko-geureonde
    categories:
      - connectors
    front: but, however, by the way
    back: 그런데
    pronunciation: geureonde
    examples:
      - target: 학교에 갔습니다. 그런데 문이 닫혀 있었습니다.
        translation: I went to school, but the door was closed.
  - id: ko-geureotamyeon
    categories:
      - connectors
    front: if so, in that case
    back: 그렇다면
    pronunciation: geureotamyeon
    examples:
      - target: 어렵습니까? 그렇다면 제가 도와드리겠습니다.
        translation: Is it difficult? If so, I'll help.
  - id: ko-geureochiman
    categories:
      - connectors
    front: however, but
    back: 그렇지만
    pronunciation: geureochiman
    examples:
      - target: 비쌉니다. 그렇지만 사고 싶습니다.
        translation: It's expensive, but I want to buy it.
  - id: ko-geurigo-naseo
    categories:
      - connectors
    front: after that
    back: 그리고 나서
    pronunciation: geurigo naseo
    examples:
      - target: 밥을 먹었습니다. 그리고 나서 공부했습니다.
        translation: I ate, then studied.
  - id: ko-geurigo
    categories:
      - connectors
    front: and, and then
    back: 그리고
    pronunciation: geurigo
    examples:
      - target: 저는 밥을 먹었습니다. 그리고 커피를 마셨습니다.
        translation: I ate, and then drank coffee.
  - id: ko-geumbang
    categories:
      - time
    front: soon, shortly, in a moment
    back: 금방
    pronunciation: geumbang
    examples:
      - target: 금방 다시 올게요.
        translation: I'll be back soon.
  - id: ko-geumsaek
    categories:
      - colors
    front: gold
    back: 금색
    pronunciation: geumsaek
  - id: ko-ginyeompum
    categories:
      - travel
    front: souvenir
    back: 기념품
    pronunciation: ginyeompum
  - id: ko-gireuda
    categories:
      - family
    front: to raise, to grow, to cultivate, to bring up
    back: 기르다
    pronunciation: gireuda
    examples:
      - target: 그녀는 세 아이를 기르고 있습니다.
        translation: She is raising three children.
  - id: ko-kkaeda
    categories:
      - daily-routine
    front: to wake up
    back: 깨다
    pronunciation: kkaeda
    examples:
      - target: 아침에 일찍 깼어요.
        translation: I woke up early in the morning.
  - id: ko-kkeungi
    categories:
      - virtue
    front: perseverance, tenacity, persistence
    back: 끈기
    pronunciation: kkeungi
    examples:
      - target: 끈기가 있으면 어떤 어려움도 극복할 수 있어요.
        translation: If you have perseverance, you can overcome any difficulty.
  - id: ko-kkeunkkeunhada
    categories:
      - texture
    front: to be sticky, gooey, viscous (can also imply a close/intimate relationship)
    back: 끈끈하다
    pronunciation: kkeunkkeunhada
    examples:
      - target: 이 사탕은 손에 끈끈하게 달라붙어요.
        translation: This candy sticks to my hands stickily.
  - id: ko-kkeunjeokkkeunjeokhada
    categories:
      - sensation
    front: to be sticky, to be gooey, to be clammy
    back: 끈적끈적하다
    pronunciation: kkeunjeokkkeunjeokhada
    examples:
      - target: 땀 때문에 피부가 끈적끈적해요.
        translation: My skin is sticky because of sweat.
  - id: ko-kkeunjeokhada
    categories:
      - texture
    front: sticky, gooey, viscous
    back: 끈적하다
    pronunciation: kkeunjeokhada
    examples:
      - target: 이 엿은 설탕이 많아서 끈적해요.
        translation: This yeot (Korean traditional taffy) is very sticky because it has a lot of sugar.
  - id: ko-kkeurida
    categories:
      - cooking
    front: to boil
    back: 끓이다
    pronunciation: kkeurida
    examples:
      - target: 라면을 끓이다.
        translation: To boil ramen.
  - id: ko-naajida
    categories:
      - health
    front: to get better, to improve
    back: 나아지다
    pronunciation: naajida
    examples:
      - target: 감기가 많이 나아졌어요.
        translation: My cold has gotten much better.
  - id: ko-najunge
    categories:
      - connectors
    front: later
    back: 나중에
    pronunciation: najunge
    examples:
      - target: 나중에 전화할게요.
        translation: I'll call you later.
  - id: ko-nachimban
    categories:
      - navigation
    front: compass
    back: 나침반
    pronunciation: nachimban
    examples:
      - target: 우리는 나침반을 사용하여 길을 찾았다.
        translation: We used a compass to find our way.
  - id: ko-namsaek
    categories:
      - colors
    front: navy blue, indigo
    back: 남색
    pronunciation: namsaek
  - id: ko-nangbihada
    categories:
      - time
    front: to waste, to squander
    back: 낭비하다
    pronunciation: nangbihada
    examples:
      - target: 시간을 낭비하지 마세요.
        translation: Don't waste time.
  - id: ko-naejang
    categories:
      - anatomy
    front: internal organs, viscera
    back: 내장
    pronunciation: naejang
    examples:
      - target: 의사는 환자의 내장에 문제가 있는지 확인했다.
        translation: The doctor checked if there was a problem with the patient's internal organs.
  - id: ko-naembi
    categories:
      - kitchen
    front: pot, saucepan
    back: 냄비
    pronunciation: naembi
    examples:
      - target: 라면을 끓이려면 냄비가 필요해요.
        translation: You need a pot to boil ramen.
  - id: ko-neolda
    categories:
      - description
    front: to be spacious
    back: 넓다
    pronunciation: neolda
    examples:
      - target: 우리 집 거실은 넓어요.
        translation: Our living room is spacious.
  - id: ko-noransaek
    categories:
      - colors
    front: yellow
    back: 노란색
    pronunciation: noransaek
  - id: ko-noryeok
    categories:
      - work
    front: effort
    back: 노력
    pronunciation: noryeok
    examples:
      - target: 성공하기 위해서는 노력이 필요해요.
        translation: Effort is needed to succeed.
  - id: ko-nokda
    categories:
      - change
    front: to melt
    back: 녹다
    pronunciation: nokda
    examples:
      - target: 얼음이 녹아요.
        translation: The ice melts.
  - id: ko-nungarigae
    categories:
      - object
    front: blindfold
    back: 눈가리개
    pronunciation: nungarigae
    examples:
      - target: 범인은 피해자의 눈가리개를 벗겼다.
        translation: The culprit took off the victim's blindfold.
  - id: ko-darijjitgi
    categories:
      - exercise
    front: doing the splits; the splits (as an action/technique)
    back: 다리찢기
    pronunciation: darijjitgi
    examples:
      - target: 무용수들은 유연성을 기르기 위해 매일 다리찢기를 연습합니다.
        translation: Dancers practice doing the splits every day to improve their flexibility.
  - id: ko-dasi-malhaeseo
    categories:
      - connectors
    front: in other words
    back: 다시 말해서
    pronunciation: dasi malhaeseo
    examples:
      - target: 가격이 올랐습니다. 다시 말해서, 더 비싸졌습니다.
        translation: The price went up. In other words, it became more expensive.
  - id: ko-dayanghada
    categories:
      - description
    front: to be various, diverse
    back: 다양하다
    pronunciation: dayanghada
    examples:
